    ports:
      - "8084:80"
    restart: always

  dlt:
    image: traefik/whoami
    hostname: dlt
    ports:
      - "8085:80"
    restart: always

  account-preference:
    image: traefik/whoami
    hostname: account-preference
    ports:
      - "8086:80"
    restart: always

  crm:
    image: traefik/whoami
