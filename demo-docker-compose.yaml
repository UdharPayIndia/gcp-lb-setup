version: '3.8'

# Dummy Services for E2E Networking Test
# All services use 'traefik/whoami' which returns container info on any path.
# hostname is set to the service name for easy verification via curl.

services:
  udharpay-api:
    image: traefik/whoami
    hostname: udharpay-api
    ports:
      - "8000:80"
    restart: always

  users-verifications:
    image: traefik/whoami
    hostname: users-verifications
    ports:
      - "8081:80"
    restart: always

  payments-billing:
