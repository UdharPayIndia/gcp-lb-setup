defaultService: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendBuckets/stage-bb-as1-default-503
hostRules:
- hosts:
  - '*'
  pathMatcher: main-paths
- hosts:
  - gcp-staging-distributor.rocketpay.co.in
  pathMatcher: distributor-paths
- hosts:
  - gcp-stage-api-pg.rocketpay.co.in
  pathMatcher: pg-paths
- hosts:
  - admin-staging.udharpay.com
  pathMatcher: admin-paths
name: stage-lb-as1-api-services-and-apps
pathMatchers:
- defaultService: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-distributor-app
  name: distributor-paths
- defaultService: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendBuckets/stage-bb-as1-default-503
  name: main-paths
  routeRules:
  - matchRules:
    - fullPathMatch: /account/v2/authenticate
    priority: 110
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-users-and-verifications
  - matchRules:
    - prefixMatch: /account/
    priority: 120
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-account-preference
  - matchRules:
    - prefixMatch: /account-preference/
    priority: 130
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-account-preference
  - matchRules:
    - prefixMatch: /payments-and-billing/
    - prefixMatch: /ab-experiment/
    - prefixMatch: /ab-rollout/
    priority: 140
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
  - matchRules:
    - prefixMatch: /common/wallets/
    - prefixMatch: /common/product-orders/
    - prefixMatch: /common/payment-orders/
    - prefixMatch: /common/party/
    - prefixMatch: /common/preferences/
    priority: 150
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
  - matchRules:
    - prefixMatch: /v1/merchant/kyc
    - prefixMatch: /v1/merchant/workflow
    - prefixMatch: /api/merchant/bank_details
    - prefixMatch: /api/banks
    - prefixMatch: /api/instruments
    priority: 160
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
  - matchRules:
    - prefixMatch: /api/mas/
    - prefixMatch: /api/merchant/auth/v2/
    - fullPathMatch: /api/system-status
    - prefixMatch: /api/merchant/devices
    - prefixMatch: /api/merchant/admin/
    priority: 170
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
  - matchRules:
    - fullPathMatch: /api/help
    - prefixMatch: /v1/merchant/
    - prefixMatch: /api/merchant/user-query
    - prefixMatch: /api/merchant/auth
    priority: 180
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-udharpay-api
  - matchRules:
    - prefixMatch: /api/merchant/
    priority: 190
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
  - matchRules:
    - prefixMatch: /superkey/
    - prefixMatch: /rocketscore/
    - prefixMatch: /super-key/
    - prefixMatch: /credit-score/
    - prefixMatch: /referrals/
    priority: 200
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-superkey
  - matchRules:
    - prefixMatch: /verification/
    - prefixMatch: /auth/
    - prefixMatch: /analytics/
    - prefixMatch: /auth-migration/
    - prefixMatch: /acl/
    priority: 210
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-users-and-verifications
  - matchRules:
    - prefixMatch: /dlt/
    priority: 220
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-dlt
  - matchRules:
    - prefixMatch: /v2/merchant/
    - prefixMatch: /api/
    - prefixMatch: /common/mappings/
    - prefixMatch: /v1/customer/
    - prefixMatch: /v3/merchant/
    priority: 230
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-udharpay-api
  - matchRules:
    - prefixMatch: /v4/mandates
    - prefixMatch: /v4/installments
    priority: 240
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-udharpay-api
  - matchRules:
    - prefixMatch: /rule/
    priority: 250
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-platform-rule-engine
  - matchRules:
    - prefixMatch: /kyc/
    - prefixMatch: /workflow/
    priority: 280
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-workflow
  - matchRules:
    - prefixMatch: /key-gateway/
    priority: 300
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-key-gateway
  - matchRules:
    - prefixMatch: /cus/
    priority: 310
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
  - matchRules:
    - prefixMatch: /book/
    priority: 320
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-platform-common
  - matchRules:
    - prefixMatch: /product-order/
    priority: 330
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-product-order
  - matchRules:
    - prefixMatch: /crm/
    priority: 350
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-crm
  - matchRules:
    - prefixMatch: /agreement/
    priority: 360
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
  - matchRules:
    - prefixMatch: /common/charges/
    priority: 380
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-payments-and-billing
- defaultService: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendBuckets/stage-bb-as1-default-503
  name: pg-paths
  pathRules:
  - paths:
    - /payment-account/*
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-pg-payment-account
  - paths:
    - /payment-gateway/*
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-pg-payment-gateway
  - paths:
    - /payment-instrument/*
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-pg-payment-instrument
  - paths:
    - /payment-mandate/*
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-pg-payment-mandate
  - paths:
    - /payment-order/*
    service: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-pg-payment-order
- defaultService: https://www.googleapis.com/compute/v1/projects/rocketpay-gcp-setup/global/backendServices/stage-bs-as1-udharpay-admin
  name: admin-paths
