server {
    # Listen on HTTP
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # ---------------------------------------------------------
    # HTTPS Configuration (Uncomment and configure if needed)
    # ---------------------------------------------------------
    # listen 443 ssl default_server;
    # listen [::]:443 ssl default_server;
    # ssl_certificate     /path/to/your/cert.crt;
    # ssl_certificate_key /path/to/your/private.key;

    # Catch-all server name
    server_name _;

    location / {
        # Redirect all requests preserving method and body (307 Temporary Redirect)
        return 307 https://gcp-api-staging.rocketpay.co.in$request_uri;

        # ---------------------------------------------------------
        # Target Proxy Destination
        # ---------------------------------------------------------
        # REPLACE THIS with your actual target hostname and protocol (http or https)
        proxy_pass http://your-target-hostname.com;

        # ---------------------------------------------------------
        # Header Preservation
        # ---------------------------------------------------------
        # Preserve the exact Host header sent by the client
        proxy_set_header Host $http_host;

        # Preserve the client's original IP and protocol scheme
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx forwards headers & body by default, these explicitly enforce it
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        
        # ---------------------------------------------------------
        # WebSocket Support (Optional, but good for "preserving everything")
        # ---------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
